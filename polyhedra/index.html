<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>There are 48 regular polyhedra.</title>
		<link rel="icon" href="../icons/owl-outline.svg" type="image/svg+xml">
		<link rel="preload" href="../fonts/national-2-light.woff2" as="font" type="font/woff2" crossorigin>
		<script src="../js/theme.js"></script>
		<link rel="stylesheet" href="../site.css">
		<link rel="stylesheet" href="polyhedra.css">
		<script type="module" src="js/toy.js"></script>
	</head>
	<body>
		<div class="tt-layout">
			<header class="title-block tt-head" id="top">
				<h1>There are <span class="tt-count">18</span> <span class="tt-kind">finite</span> regular polyhedra.<span class="tt-fam-nav"><button type="button" class="tt-caret tt-caret-up" data-nav="up" aria-label="Previous family"><svg viewBox="0 0 12 8" aria-hidden="true" focusable="false"><path d="M2 6.5 6 2.5l4 4" /></svg></button><button type="button" class="tt-caret tt-caret-down" data-nav="down" aria-label="Next family"><svg viewBox="0 0 12 8" aria-hidden="true" focusable="false"><path d="M2 1.5l4 4 4-4" /></svg></button></span></h1>
				<p class="tt-home"><a href="../index.html">Evan Angelone</a></p>
				<p class="tt-theme theme-slot" data-theme-toggle></p>
			</header>
			<main class="tt-main" id="content">
				<p class="tt-family label" id="tt-family">Platonic solids</p>
				<figure class="fig tt-fig">
					<!-- The polyhedron, a caret to either side for its neighbors. -->
					<div class="tt-strip">
						<div class="tt-stage">
							<button type="button" class="tt-caret tt-caret-side tt-prev" data-nav="left" aria-label="Previous polyhedron"><svg viewBox="0 0 8 14" aria-hidden="true" focusable="false"><path d="M6.5 1.5 1.5 7l5 5.5" /></svg></button>
							<button class="tt-toy" type="button" aria-label="Dodecahedron. Press to apply a random symmetry." aria-describedby="tt-cap">
								<svg viewBox="-40 -40 592 592" aria-hidden="true" focusable="false">
								</svg>
							</button>
							<button type="button" class="tt-caret tt-caret-side tt-next" data-nav="right" aria-label="Next polyhedron"><svg viewBox="0 0 8 14" aria-hidden="true" focusable="false"><path d="M1.5 1.5 6.5 7l-5 5.5" /></svg></button>
						</div>
						<!-- The figure going, as it slides away or turns over on the wheel. -->
						<div class="tt-ghosts" aria-hidden="true"></div>
					</div>
					<figcaption>
						<span class="fig-label">Figure 1.</span>
						<span class="cap" id="tt-cap" aria-live="polite">The dodecahedron, {5,&nbsp;3}.</span>
					</figcaption>
					<!-- Each move, and why an operation is refused, for screen readers. -->
					<p class="tt-sr" id="tt-say" aria-live="polite"></p>
					<noscript>
						<p class="tt-noscript">This page needs JavaScript.</p>
					</noscript>
				</figure>
			</main>
			<!-- The keys, in a row along the bottom. Each also works as a click. -->
			<p class="tt-keys" role="group" aria-label="Keys">
				<button type="button" class="tt-hint" data-act="left right"><kbd data-key="ArrowLeft">&larr;</kbd><kbd data-key="ArrowRight">&rarr;</kbd> polyhedron</button>
				<button type="button" class="tt-hint" data-act="up down"><kbd data-key="ArrowUp">&uarr;</kbd><kbd data-key="ArrowDown">&darr;</kbd> family</button>
				<button type="button" class="tt-hint" data-act="random"><kbd data-key="space" class="tt-wide-key">space</kbd> random symmetry</button>
				<label class="tt-hint tt-toggle"><span class="tt-switch"><input type="checkbox" class="tt-mode-input"><span class="tt-slider"></span></span>all symmetries</label>
				<button type="button" class="tt-hint" data-act="petrial"><kbd data-key="p">P</kbd> Petrial</button>
				<button type="button" class="tt-hint" data-act="dual"><kbd data-key="d">D</kbd> dual</button>
				<button type="button" class="tt-hint" data-act="facet" data-only="facet"><kbd data-key="f">F</kbd> facetting</button>
				<button type="button" class="tt-hint" data-act="halve" data-only="pure"><kbd data-key="h">H</kbd> halving</button>
				<button type="button" class="tt-hint" data-act="skew" data-only="pure"><kbd data-key="s">S</kbd> skewing</button>
				<button type="button" class="tt-hint" data-act="blend" data-only="blend"><kbd data-key="b">B</kbd> blend with a segment</button>
				<button type="button" class="tt-hint" data-act="blend-line" data-only="blend"><kbd data-key="B">&#8679;B</kbd> with a line</button>
				<button type="button" class="tt-hint" data-act="flag"><kbd data-key="F">&#8679;F</kbd> flag</button>
				<button type="button" class="tt-hint" data-act="face" data-mac><kbd data-key="ctrl-f">&#8963;F</kbd> a face</button>
			</p>
			<!-- Where you are among the polyhedra of the family: the right margin on wide screens, below the figure otherwise. -->
			<aside class="tt-margin" aria-label="Map">
				<figure class="fig tt-map">
					<svg class="tt-map-svg" viewBox="0 0 260 404" role="group" aria-labelledby="tt-map-cap">
					</svg>
					<figcaption>
						<span class="fig-label">Figure 2.</span>
						<span class="cap" id="tt-map-cap">You are here, in red, among the 18 finite regular polyhedra, after McMullen and Schulte. P is the Petrial, D the dual, and F the facetting (<i>R</i><sub>0</sub>, <i>R</i><sub>1</sub>, <i>R</i><sub>2</sub>) &#8614; (<i>R</i><sub>0</sub>, <i>R</i><sub>1</sub><i>R</i><sub>2</sub><i>R</i><sub>1</sub>, <i>R</i><sub>2</sub>). Click a polyhedron to go there.</span>
					</figcaption>
				</figure>
			</aside>
			<footer class="tt-foot">
				<p>Vibecoded with Claude.</p>
			</footer>
		</div>
	</body>
</html>
